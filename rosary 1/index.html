<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rosary — A Contemplative Companion</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: #1a1410;
    color: #e8dcc8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: 0.15em;
    color: #c9a96e;
    text-align: center;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    font-style: italic;
    font-size: 0.9rem;
    color: #8a7a62;
    text-align: center;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  .screen { display: none; width: 100%; max-width: 560px; }
  .screen.active { display: block; }

  .setup-section { margin-bottom: 1.5rem; }
  .setup-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8a7a62;
    margin-bottom: 0.75rem;
  }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .option-btn {
    background: #2a2018;
    border: 1px solid #3d3020;
    color: #c8b898;
    font-family: 'EB Garamond', serif;
    font-size: 0.95rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.3;
  }
  .option-btn:hover { border-color: #c9a96e; color: #e8dcc8; }
  .option-btn.selected { border-color: #c9a96e; background: #2f2416; color: #c9a96e; }
  .option-btn small { display: block; font-size: 0.78rem; color: #6a5c48; margin-top: 2px; font-style: italic; }
  .option-btn.selected small { color: #8a7055; }
  .mystery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

  .start-btn {
    width: 100%;
    padding: 1rem;
    background: #c9a96e;
    color: #1a1410;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 1.5rem;
    transition: background 0.2s;
  }
  .start-btn:hover { background: #d4b87a; }
  .start-btn:disabled { background: #4a3c28; color: #6a5c48; cursor: default; }

  .prayer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .mystery-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: #c9a96e;
  }
  .progress-text {
    font-size: 0.8rem;
    color: #6a5c48;
    letter-spacing: 0.08em;
  }

  #rosary-svg {
    width: 100%;
    max-width: 340px;
    margin: 0.25rem auto 0.5rem;
    display: block;
    overflow: visible;
  }
  .rb-chain { fill: none; stroke: #2a2018; stroke-width: 1.5; }
  .rb-bead { transition: filter 0.5s ease; }
  .rb-bead circle {
    fill: #211c13;
    stroke: #3d3020;
    stroke-width: 1.5;
    transition: fill 0.5s ease, stroke 0.5s ease;
  }
  .rb-bead.done circle { fill: url(#grad-done); stroke: #9a6820; }
  .rb-bead.current circle { fill: url(#grad-current); stroke: #c9a96e; }
  .rb-bead.current { animation: bead-pulse 2s ease-in-out infinite; }
  @keyframes bead-pulse {
    0%,100% { filter: drop-shadow(0 0 4px rgba(201,169,110,0.5)); }
    50%      { filter: drop-shadow(0 0 12px rgba(201,169,110,1)); }
  }
  .rb-cross { transition: filter 0.5s ease; }
  .rb-cross line {
    stroke: #3d3020;
    stroke-width: 3.5;
    stroke-linecap: round;
    transition: stroke 0.5s ease;
  }
  .rb-cross.done line { stroke: #9a6820; }
  .rb-cross.current line { stroke: #f0e8d8; }
  .rb-cross.current { animation: bead-pulse 2s ease-in-out infinite; }

  .prayer-card {
    background: #211c14;
    border: 1px solid #3d3020;
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    min-height: 120px;
  }
  .prayer-type {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8a7a62;
    margin-bottom: 0.5rem;
  }
  .prayer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: #c9a96e;
    margin-bottom: 0.75rem;
    font-style: italic;
  }
  .prayer-text {
    font-size: 1rem;
    line-height: 1.7;
    color: #c8b898;
  }
  .mystery-text {
    font-size: 0.9rem;
    font-style: italic;
    color: #8a7a62;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid #2f2416;
  }

  .controls { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
  .ctrl-btn {
    flex: 1;
    padding: 0.75rem;
    border-radius: 4px;
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #3d3020;
  }
  .btn-prev { background: transparent; color: #8a7a62; }
  .btn-prev:hover { color: #c8b898; border-color: #5a4a30; }
  .btn-next { background: #c9a96e; color: #1a1410; border-color: #c9a96e; }
  .btn-next:hover { background: #d4b87a; }

  .mic-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid #3d3020;
    background: #2a2018;
    color: #8a7a62;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .mic-btn:hover { border-color: #c9a96e; color: #c9a96e; }
  .mic-btn.listening { border-color: #e8573a; color: #e8573a; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(232,87,58,0)} 50%{box-shadow:0 0 0 6px rgba(232,87,58,0.2)} }

  .status-bar {
    font-size: 0.8rem;
    color: #6a5c48;
    text-align: center;
    min-height: 1.2em;
    font-style: italic;
  }
  .status-bar.active { color: #c9a96e; }

  .back-btn {
    background: transparent;
    border: none;
    color: #6a5c48;
    font-family: 'EB Garamond', serif;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    padding: 0;
  }
  .back-btn:hover { color: #c8b898; }

  .complete-card {
    background: #211c14;
    border: 1px solid #3d3020;
    border-radius: 6px;
    padding: 2rem;
    text-align: center;
  }
  .complete-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: #c9a96e;
    font-weight: 300;
    margin-bottom: 0.75rem;
  }
  .complete-card p { color: #8a7a62; font-style: italic; line-height: 1.6; }
  .restart-btn {
    margin-top: 1.5rem;
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid #c9a96e;
    color: #c9a96e;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .restart-btn:hover { background: #c9a96e; color: #1a1410; }

  hr.divider { border: none; border-top: 1px solid #2f2416; margin: 1rem 0; }
</style>
</head>
<body>

<h1>✦ The Rosary</h1>
<p class="subtitle">A contemplative companion for prayer</p>

<!-- Setup Screen -->
<div class="screen active" id="screen-setup">
  <div class="setup-section">
    <div class="setup-label">Choose mysteries</div>
    <div class="mystery-grid">
      <button class="option-btn" data-mystery="joyful" onclick="selectOption(this,'mystery')">
        Joyful <small>Monday &amp; Saturday</small>
      </button>
      <button class="option-btn" data-mystery="sorrowful" onclick="selectOption(this,'mystery')">
        Sorrowful <small>Tuesday &amp; Friday</small>
      </button>
      <button class="option-btn" data-mystery="glorious" onclick="selectOption(this,'mystery')">
        Glorious <small>Wednesday &amp; Sunday</small>
      </button>
      <button class="option-btn" data-mystery="luminous" onclick="selectOption(this,'mystery')">
        Luminous <small>Thursday</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Advance beads by</div>
    <div class="option-grid">
      <button class="option-btn selected" data-advance="tap" onclick="selectOption(this,'advance')">
        Tap / click <small>Manual advance</small>
      </button>
      <button class="option-btn" data-advance="voice" onclick="selectOption(this,'advance')">
        Voice <small>Auto-advance as you pray</small>
      </button>
    </div>
  </div>
  <button class="start-btn" id="start-btn" onclick="startRosary()" disabled>Begin</button>
</div>

<!-- Prayer Screen -->
<div class="screen" id="screen-prayer">
  <button class="back-btn" onclick="showSetup()">← back</button>
  <div class="prayer-header">
    <span class="mystery-name" id="mystery-label"></span>
    <span class="progress-text" id="progress-label"></span>
  </div>
  <svg id="rosary-svg" viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="prayer-card">
    <div class="prayer-type" id="prayer-type"></div>
    <div class="prayer-name" id="prayer-name"></div>
    <div class="prayer-text" id="prayer-text"></div>
    <div class="mystery-text" id="mystery-text" style="display:none"></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn btn-prev" onclick="prevBead()">← prev</button>
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Toggle voice">
      <i class="ti ti-microphone"></i>
    </button>
    <button class="ctrl-btn btn-next" onclick="nextBead()">next →</button>
  </div>
  <div class="status-bar" id="status-bar">Tap "next" or use voice to advance</div>
</div>

<!-- Complete Screen -->
<div class="screen" id="screen-complete">
  <div class="complete-card">
    <h2>Rosary Complete</h2>
    <hr class="divider">
    <p>"The Rosary is the weapon for these times."<br><em>— Padre Pio</em></p>
    <button class="restart-btn" onclick="showSetup()">Pray again</button>
  </div>
</div>

<script>
const MYSTERIES = {
  joyful: {
    name: 'Joyful Mysteries',
    list: ['The Annunciation','The Visitation','The Nativity','The Presentation','The Finding in the Temple']
  },
  sorrowful: {
    name: 'Sorrowful Mysteries',
    list: ['The Agony in the Garden','The Scourging at the Pillar','The Crowning with Thorns','The Carrying of the Cross','The Crucifixion']
  },
  glorious: {
    name: 'Glorious Mysteries',
    list: ['The Resurrection','The Ascension','The Descent of the Holy Spirit','The Assumption of Mary','The Coronation of Mary']
  },
  luminous: {
    name: 'Luminous Mysteries',
    list: ['The Baptism of the Lord','The Wedding at Cana','The Proclamation of the Kingdom','The Transfiguration','The Institution of the Eucharist']
  }
};

const PRAYERS = {
  apostlesCreed: { type: 'Opening prayer', name: "Apostle's Creed", text: "I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen." },
  ourFather: { type: 'Our Father bead', name: 'Our Father', text: "Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen." },
  hailMary: { type: 'Hail Mary bead', name: 'Hail Mary', text: "Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen." },
  gloryBe: { type: 'Glory Be', name: 'Glory Be', text: "Glory be to the Father, and to the Son, and to the Holy Spirit; as it was in the beginning, is now, and ever shall be, world without end. Amen." },
  fatima: { type: 'Fatima Prayer', name: 'O My Jesus', text: "O my Jesus, forgive us our sins, save us from the fires of hell, lead all souls to Heaven, especially those most in need of Thy mercy. Amen." },
  hailHolyQueen: { type: 'Closing prayer', name: 'Hail, Holy Queen', text: "Hail, Holy Queen, Mother of Mercy! Our life, our sweetness, and our hope! To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious Advocate, thine eyes of mercy toward us; and after this our exile show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary. Pray for us, O holy Mother of God, that we may be made worthy of the promises of Christ. Amen." }
};

function buildSequence(mysteryKey) {
  const mysteries = MYSTERIES[mysteryKey].list;
  let seq = [];
  seq.push({ ...PRAYERS.apostlesCreed, bead: 'cross' });
  seq.push({ ...PRAYERS.ourFather, bead: 'large' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Faith' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Hope' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Charity' });
  seq.push({ ...PRAYERS.gloryBe, bead: 'chain' });
  for (let d = 0; d < 5; d++) {
    seq.push({ ...PRAYERS.ourFather, bead: 'large', mystery: mysteries[d], decade: d + 1 });
    for (let h = 0; h < 10; h++) {
      seq.push({ ...PRAYERS.hailMary, bead: 'small', mystery: mysteries[d] });
    }
    seq.push({ ...PRAYERS.gloryBe, bead: 'chain', mystery: mysteries[d] });
    seq.push({ ...PRAYERS.fatima, bead: 'chain', mystery: mysteries[d] });
  }
  seq.push({ ...PRAYERS.hailHolyQueen, bead: 'chain' });
  return seq;
}

let state = { mysteryKey: null, advanceMode: 'tap', sequence: [], currentIndex: 0, listening: false };
let selections = { mystery: null, advance: 'tap' };
let recog = null;

function selectOption(btn, group) {
  document.querySelectorAll('[data-' + group + ']').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections[group] = btn.dataset[group];
  updateStartBtn();
}

function updateStartBtn() {
  document.getElementById('start-btn').disabled = !selections.mystery;
}

function startRosary() {
  state.mysteryKey = selections.mystery;
  state.advanceMode = selections.advance;
  state.sequence = buildSequence(state.mysteryKey);
  state.currentIndex = 0;
  state.listening = false;
  svgBuilt = false;
  showScreen('screen-prayer');
  renderPrayer();
  if (state.advanceMode === 'voice') setTimeout(() => startListening(), 500);
}

function showSetup() {
  stopListening();
  showScreen('screen-setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderPrayer() {
  const step = state.sequence[state.currentIndex];
  document.getElementById('mystery-label').textContent = MYSTERIES[state.mysteryKey].name;
  document.getElementById('progress-label').textContent = (state.currentIndex + 1) + ' / ' + state.sequence.length;
  document.getElementById('prayer-type').textContent = step.type || '';
  document.getElementById('prayer-name').textContent = step.name || '';
  document.getElementById('prayer-text').textContent = step.text || '';
  const mysteryEl = document.getElementById('mystery-text');
  if (step.mystery) {
    mysteryEl.style.display = 'block';
    mysteryEl.textContent = (step.decade ? step.decade + '. ' : '') + step.mystery;
  } else if (step.sub) {
    mysteryEl.style.display = 'block';
    mysteryEl.textContent = step.sub;
  } else {
    mysteryEl.style.display = 'none';
  }
  renderBeads();
}

// ── SVG Rosary ───────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const R_CX = 170, R_CY = 148, R_RX = 125, R_RY = 102, R_JY = 250;

const PENDANT_POS = [
  { seq: 5, y: 276, r: 4.5 },
  { seq: 4, y: 298, r: 4.5 },
  { seq: 3, y: 318, r: 4.5 },
  { seq: 2, y: 338, r: 4.5 },
  { seq: 1, y: 362, r: 7   },
];
const OF_CIRCLE = new Set([0, 13, 26, 39, 52]);
let svgBuilt = false;

function mkEl(tag) { return document.createElementNS(SVG_NS, tag); }

function addBead(svg, seqIdx, x, y, r) {
  const g = mkEl('g');
  g.setAttribute('id', 'rb-' + seqIdx);
  g.setAttribute('class', 'rb-bead');
  const c = mkEl('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  g.appendChild(c);
  svg.appendChild(g);
}

function buildRosarySVG() {
  const svg = document.getElementById('rosary-svg');
  svg.innerHTML = '';

  const defs = mkEl('defs');
  defs.innerHTML = `
    <radialGradient id="grad-done" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#6e3e08"/>
    </radialGradient>
    <radialGradient id="grad-current" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ede0c8"/>
      <stop offset="100%" stop-color="#b8a070"/>
    </radialGradient>`;
  svg.appendChild(defs);

  const ell = mkEl('ellipse');
  ell.setAttribute('cx', R_CX); ell.setAttribute('cy', R_CY);
  ell.setAttribute('rx', R_RX); ell.setAttribute('ry', R_RY);
  ell.setAttribute('class', 'rb-chain');
  svg.appendChild(ell);

  const chainYs = [R_JY, ...PENDANT_POS.map(p => p.y), 383];
  for (let i = 0; i < chainYs.length - 1; i++) {
    const ln = mkEl('line');
    ln.setAttribute('x1', R_CX); ln.setAttribute('y1', chainYs[i]);
    ln.setAttribute('x2', R_CX); ln.setAttribute('y2', chainYs[i + 1]);
    ln.setAttribute('class', 'rb-chain');
    svg.appendChild(ln);
  }

  const crossG = mkEl('g');
  crossG.setAttribute('id', 'rb-0');
  crossG.setAttribute('class', 'rb-cross');
  const vBar = mkEl('line');
  vBar.setAttribute('x1', R_CX); vBar.setAttribute('y1', 383);
  vBar.setAttribute('x2', R_CX); vBar.setAttribute('y2', 414);
  const hBar = mkEl('line');
  hBar.setAttribute('x1', R_CX - 12); hBar.setAttribute('y1', 390);
  hBar.setAttribute('x2', R_CX + 12); hBar.setAttribute('y2', 390);
  crossG.appendChild(vBar); crossG.appendChild(hBar);
  svg.appendChild(crossG);

  addBead(svg, 71, R_CX, R_JY, 9);
  for (const p of PENDANT_POS) addBead(svg, p.seq, R_CX, p.y, p.r);

  const step = (2 * Math.PI) / 66;
  for (let i = 0; i < 65; i++) {
    const angle = Math.PI / 2 + (i + 1) * step;
    addBead(svg, 6 + i,
      R_CX + R_RX * Math.cos(angle),
      R_CY + R_RY * Math.sin(angle),
      OF_CIRCLE.has(i) ? 7 : 4.5);
  }

  svgBuilt = true;
}

function renderBeads() {
  if (!svgBuilt) buildRosarySVG();
  const idx = state.currentIndex;

  const cross = document.getElementById('rb-0');
  if (cross) cross.setAttribute('class',
    'rb-cross' + (idx === 0 ? ' current' : idx > 0 ? ' done' : ''));

  for (let s = 1; s <= 71; s++) {
    const b = document.getElementById('rb-' + s);
    if (b) b.setAttribute('class',
      'rb-bead' + (s === idx ? ' current' : s < idx ? ' done' : ''));
  }
}

function nextBead() {
  if (state.currentIndex < state.sequence.length - 1) {
    state.currentIndex++;
    renderPrayer();
  } else {
    stopListening();
    showScreen('screen-complete');
  }
}

function prevBead() {
  if (state.currentIndex > 0) { state.currentIndex--; renderPrayer(); }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleMic() {
  if (state.listening) {
    stopListening();
    updateStatus('Voice paused — tap next or enable voice again', false);
  } else {
    startListening();
  }
}

function startListening() {
  if (!SpeechRecognition) { updateStatus('Voice not supported — use Chrome or Safari', false); return; }
  if (recog) { try { recog.stop(); } catch(e){} }
  recog = new SpeechRecognition();
  recog.continuous = true;
  recog.interimResults = false;
  recog.lang = 'en-US';
  recog.onstart = () => {
    state.listening = true;
    document.getElementById('mic-btn').classList.add('listening');
    updateStatus('Listening… pray aloud to advance', true);
  };
  recog.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal && last[0].transcript.trim().length > 8) nextBead();
  };
  recog.onerror = (e) => {
    if (e.error !== 'no-speech') {
      state.listening = false;
      document.getElementById('mic-btn').classList.remove('listening');
      updateStatus('Voice error — tap mic to retry', false);
    }
  };
  recog.onend = () => {
    if (state.listening) { try { recog.start(); } catch(e){} }
    else { document.getElementById('mic-btn').classList.remove('listening'); }
  };
  try { recog.start(); } catch(e) { updateStatus('Could not start microphone', false); }
}

function stopListening() {
  state.listening = false;
  if (recog) { try { recog.stop(); } catch(e){} recog = null; }
  const btn = document.getElementById('mic-btn');
  if (btn) btn.classList.remove('listening');
}

function updateStatus(msg, active) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar' + (active ? ' active' : '');
}

// Pre-select today's mystery
const dayMystery = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'}[new Date().getDay()];
const todayBtn = document.querySelector('[data-mystery="' + dayMystery + '"]');
if (todayBtn) { todayBtn.classList.add('selected'); selections.mystery = dayMystery; updateStartBtn(); }
</script>
