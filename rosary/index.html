<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rosary — A Contemplative Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #1a1410;
    --surface: #211c14;
    --surface-2: #2a2018;
    --surface-selected: #2f2416;
    --border: #3d3020;
    --border-hover: #5a4a30;
    --text: #e8dcc8;
    --text-soft: #d8cab2;
    --muted: #9b8a6e;
    --muted-2: #75664f;
    --accent: #c9a96e;
    --accent-hover: #d4b87a;
    --accent-contrast: #1a1410;
    --chain: #2a2018;
    --bead-fill: #211c13;
    --divider: #2f2416;
    --done-stroke: #9a6820;
    --cross-current: #f0e8d8;
    --listening: #e8573a;
  }
  body[data-theme="marian"] {
    --bg: #101723;
    --surface: #172033;
    --surface-2: #1d2a40;
    --surface-selected: #22314c;
    --border: #304662;
    --border-hover: #58708d;
    --text: #f2eadc;
    --text-soft: #ddd3c2;
    --muted: #9aa8b6;
    --muted-2: #748395;
    --accent: #d4b16a;
    --accent-hover: #e2c27d;
    --accent-contrast: #101723;
    --chain: #253650;
    --bead-fill: #162135;
    --divider: #253650;
    --done-stroke: #b88c3a;
    --cross-current: #f7f0e4;
  }
  body[data-theme="rose"] {
    --bg: #1d1015;
    --surface: #2a1720;
    --surface-2: #351d28;
    --surface-selected: #3c202c;
    --border: #553042;
    --border-hover: #86576a;
    --text: #f4e8df;
    --text-soft: #e2cec6;
    --muted: #b2939b;
    --muted-2: #8e6f77;
    --accent: #d8b56d;
    --accent-hover: #e4c680;
    --accent-contrast: #1d1015;
    --chain: #3a202b;
    --bead-fill: #24131b;
    --divider: #3a202b;
    --done-stroke: #b8834d;
    --cross-current: #fff0e8;
  }
  body[data-theme="stone"] {
    --bg: #171716;
    --surface: #242321;
    --surface-2: #2d2b28;
    --surface-selected: #343129;
    --border: #4a463f;
    --border-hover: #756d60;
    --text: #eee8dc;
    --text-soft: #d8d0c2;
    --muted: #aaa197;
    --muted-2: #827970;
    --accent: #c5a464;
    --accent-hover: #d2b372;
    --accent-contrast: #171716;
    --chain: #32302c;
    --bead-fill: #20201e;
    --divider: #37332d;
    --done-stroke: #94723f;
    --cross-current: #f7f1e7;
  }
  body[data-theme="olive"] {
    --bg: #11170f;
    --surface: #1c2618;
    --surface-2: #25311f;
    --surface-selected: #2a371f;
    --border: #405139;
    --border-hover: #6d7d58;
    --text: #f0ead8;
    --text-soft: #d9d1b8;
    --muted: #aab49a;
    --muted-2: #7e8a70;
    --accent: #d6b766;
    --accent-hover: #e0c678;
    --accent-contrast: #11170f;
    --chain: #2d3a25;
    --bead-fill: #182115;
    --divider: #2d3a25;
    --done-stroke: #9b833f;
    --cross-current: #f7f0de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-align: center;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    font-style: italic;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  .screen { display: none; width: 100%; max-width: 560px; }
  .screen.active { display: block; }

  .setup-section { margin-bottom: 1.5rem; }
  .setup-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .decade-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .decade-grid .option-btn {
    min-height: 64px;
    padding: 0.65rem 0.35rem;
    text-align: center;
    font-size: 0.88rem;
  }
  .decade-grid .option-btn small { font-size: 0.7rem; }
  .option-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.95rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.3;
  }
  .option-btn:hover { border-color: var(--accent); color: var(--text); }
  .option-btn.selected { border-color: var(--accent); background: var(--surface-selected); color: var(--accent); }
  .option-btn small { display: block; font-size: 0.78rem; color: var(--muted-2); margin-top: 2px; font-style: italic; }
  .option-btn.selected small { color: var(--muted); }
  .theme-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.5rem; }
  .theme-card {
    --preview-bg: #1a1410;
    --preview-surface: #211c14;
    --preview-text: #e8dcc8;
    --preview-muted: #8a7a62;
    --preview-accent: #c9a96e;
    min-height: 108px;
    padding: 0.65rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--preview-bg);
    color: var(--preview-text);
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .theme-card:hover,
  .theme-card.selected { border-color: var(--accent); transform: translateY(-1px); }
  .theme-card.selected { box-shadow: inset 0 0 0 1px var(--accent); }
  .theme-card[data-theme-option="marian"] {
    --preview-bg: #101723; --preview-surface: #172033; --preview-text: #f2eadc; --preview-muted: #9aa8b6; --preview-accent: #d4b16a;
  }
  .theme-card[data-theme-option="rose"] {
    --preview-bg: #1d1015; --preview-surface: #2a1720; --preview-text: #f4e8df; --preview-muted: #b2939b; --preview-accent: #d8b56d;
  }
  .theme-card[data-theme-option="stone"] {
    --preview-bg: #171716; --preview-surface: #242321; --preview-text: #eee8dc; --preview-muted: #aaa197; --preview-accent: #c5a464;
  }
  .theme-card[data-theme-option="olive"] {
    --preview-bg: #11170f; --preview-surface: #1c2618; --preview-text: #f0ead8; --preview-muted: #aab49a; --preview-accent: #d6b766;
  }
  .theme-name {
    display: block;
    margin-bottom: 0.55rem;
    color: var(--preview-accent);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    line-height: 1;
  }
  .theme-sample {
    display: block;
    padding: 0.45rem;
    border: 1px solid color-mix(in srgb, var(--preview-accent) 35%, transparent);
    background: var(--preview-surface);
    color: var(--preview-text);
    font-size: 0.68rem;
    line-height: 1.35;
  }
  .theme-muted { display: block; color: var(--preview-muted); font-style: italic; }
  .theme-swatches { display: flex; gap: 0.22rem; margin-top: 0.55rem; }
  .theme-swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .theme-swatch.bg { background: var(--preview-bg); }
  .theme-swatch.surface { background: var(--preview-surface); }
  .theme-swatch.accent { background: var(--preview-accent); }
  .theme-swatch.text { background: var(--preview-text); }
  .mystery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

  .start-btn {
    width: 100%;
    padding: 1rem;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 1.5rem;
    transition: background 0.2s;
  }
  .start-btn:hover { background: var(--accent-hover); }
  .start-btn:disabled { background: var(--surface-selected); color: var(--muted-2); cursor: default; }

  .prayer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .mystery-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--accent);
  }
  .progress-text {
    font-size: 0.8rem;
    color: var(--muted-2);
    letter-spacing: 0.08em;
  }

  #rosary-svg {
    width: 100%;
    max-width: 340px;
    margin: 0.25rem auto 0.5rem;
    display: block;
    overflow: visible;
  }
  .rb-chain { fill: none; stroke: var(--chain); stroke-width: 1.5; }
  .rb-bead { transition: filter 0.5s ease; }
  .rb-bead circle {
    fill: var(--bead-fill);
    stroke: var(--border);
    stroke-width: 1.5;
    transition: fill 0.5s ease, stroke 0.5s ease;
  }
  .rb-bead.done circle { fill: url(#grad-done); stroke: var(--done-stroke); }
  .rb-bead.current circle { fill: url(#grad-current); stroke: var(--accent); }
  .rb-bead.current { animation: bead-pulse 2s ease-in-out infinite; }
  @keyframes bead-pulse {
    0%,100% { filter: drop-shadow(0 0 4px rgba(201,169,110,0.5)); }
    50%      { filter: drop-shadow(0 0 12px rgba(201,169,110,1)); }
  }
  .rb-cross { transition: filter 0.5s ease; }
  .rb-cross line {
    stroke: var(--border);
    stroke-width: 3.5;
    stroke-linecap: round;
    transition: stroke 0.5s ease;
  }
  .rb-cross.done line { stroke: var(--done-stroke); }
  .rb-cross.current line { stroke: var(--cross-current); }
  .rb-cross.current { animation: bead-pulse 2s ease-in-out infinite; }

  .prayer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    min-height: 120px;
  }
  .prayer-type {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .prayer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.75rem;
    font-style: italic;
  }
  .prayer-text {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text-soft);
  }
  .mystery-text {
    font-size: 0.9rem;
    font-style: italic;
    color: var(--muted);
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--divider);
  }

  .controls { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
  .top-controls { margin-bottom: 1.25rem; }
  .ctrl-btn {
    flex: 1;
    padding: 0.75rem;
    border-radius: 4px;
    font-family: 'Lora', Georgia, serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
  }
  .btn-prev { background: transparent; color: var(--muted); }
  .btn-prev:hover { color: var(--text-soft); border-color: var(--border-hover); }
  .btn-next { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-next:hover { background: var(--accent-hover); }

  .mic-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mic-btn.listening { border-color: var(--listening); color: var(--listening); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(232,87,58,0)} 50%{box-shadow:0 0 0 6px rgba(232,87,58,0.2)} }

  .status-bar {
    font-size: 0.8rem;
    color: var(--muted-2);
    text-align: center;
    min-height: 1.2em;
    font-style: italic;
  }
  .status-bar.active { color: var(--accent); }

  .back-btn {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 10;
    background: transparent;
    border: none;
    color: var(--muted-2);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    padding: 0;
  }
  .back-btn:hover { color: var(--text-soft); }

  .complete-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2rem;
    text-align: center;
  }
  .complete-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--accent);
    font-weight: 300;
    margin-bottom: 0.75rem;
  }
  .complete-card p { color: var(--muted); font-style: italic; line-height: 1.6; }
  .restart-btn {
    margin-top: 1.5rem;
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent); color: var(--accent-contrast); }

  hr.divider { border: none; border-top: 1px solid var(--divider); margin: 1rem 0; }
</style>
</head>
<body data-theme="stone">

<h1>✦ The Rosary</h1>
<p class="subtitle">A contemplative companion for prayer</p>

<!-- Setup Screen -->
<div class="screen active" id="screen-setup">
  <div class="setup-section">
    <div class="setup-label">Choose mysteries</div>
    <div class="mystery-grid">
      <button class="option-btn" data-mystery="joyful" onclick="selectOption(this,'mystery')">
        Joyful <small>Monday &amp; Saturday</small>
      </button>
      <button class="option-btn" data-mystery="sorrowful" onclick="selectOption(this,'mystery')">
        Sorrowful <small>Tuesday &amp; Friday</small>
      </button>
      <button class="option-btn" data-mystery="glorious" onclick="selectOption(this,'mystery')">
        Glorious <small>Wednesday &amp; Sunday</small>
      </button>
      <button class="option-btn" data-mystery="luminous" onclick="selectOption(this,'mystery')">
        Luminous <small>Thursday</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Choose rosary</div>
    <div class="option-grid">
      <button class="option-btn selected" data-rosary="dominican" onclick="selectOption(this,'rosary')">
        Dominican <small>Traditional form</small>
      </button>
      <button class="option-btn" data-rosary="scriptural" onclick="selectOption(this,'rosary')">
        Scriptural <small>With meditations</small>
      </button>
      <button class="option-btn" data-rosary="sevenSorrows" onclick="selectOption(this,'rosary')">
        Seven Sorrows <small>Seven dolors</small>
      </button>
      <button class="option-btn" data-rosary="franciscanCrown" onclick="selectOption(this,'rosary')">
        Franciscan Crown <small>Seven joys</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Choose theme</div>
    <div class="theme-grid">
      <button class="theme-card" data-theme-option="candlelight" onclick="selectTheme(this)">
        <span class="theme-name">Candlelight</span>
        <span class="theme-sample">Hail Mary <span class="theme-muted">warm and quiet</span></span>
        <span class="theme-swatches">
          <span class="theme-swatch bg"></span>
          <span class="theme-swatch surface"></span>
          <span class="theme-swatch accent"></span>
          <span class="theme-swatch text"></span>
        </span>
      </button>
      <button class="theme-card" data-theme-option="marian" onclick="selectTheme(this)">
        <span class="theme-name">Marian Blue</span>
        <span class="theme-sample">Hail Mary <span class="theme-muted">clear and luminous</span></span>
        <span class="theme-swatches">
          <span class="theme-swatch bg"></span>
          <span class="theme-swatch surface"></span>
          <span class="theme-swatch accent"></span>
          <span class="theme-swatch text"></span>
        </span>
      </button>
      <button class="theme-card" data-theme-option="rose" onclick="selectTheme(this)">
        <span class="theme-name">Rose Chapel</span>
        <span class="theme-sample">Hail Mary <span class="theme-muted">soft and devotional</span></span>
        <span class="theme-swatches">
          <span class="theme-swatch bg"></span>
          <span class="theme-swatch surface"></span>
          <span class="theme-swatch accent"></span>
          <span class="theme-swatch text"></span>
        </span>
      </button>
      <button class="theme-card selected" data-theme-option="stone" onclick="selectTheme(this)">
        <span class="theme-name">Stone Chapel</span>
        <span class="theme-sample">Hail Mary <span class="theme-muted">calm and readable</span></span>
        <span class="theme-swatches">
          <span class="theme-swatch bg"></span>
          <span class="theme-swatch surface"></span>
          <span class="theme-swatch accent"></span>
          <span class="theme-swatch text"></span>
        </span>
      </button>
      <button class="theme-card" data-theme-option="olive" onclick="selectTheme(this)">
        <span class="theme-name">Olive &amp; Beeswax</span>
        <span class="theme-sample">Hail Mary <span class="theme-muted">earthy and peaceful</span></span>
        <span class="theme-swatches">
          <span class="theme-swatch bg"></span>
          <span class="theme-swatch surface"></span>
          <span class="theme-swatch accent"></span>
          <span class="theme-swatch text"></span>
        </span>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Choose decades</div>
    <div class="option-grid decade-grid">
      <button class="option-btn" data-decades="1" onclick="selectOption(this,'decades')">
        One Decade <small>3 beads + 1 decade</small>
      </button>
      <button class="option-btn" data-decades="2" onclick="selectOption(this,'decades')">
        Two Decades <small>Opening + 2 decades</small>
      </button>
      <button class="option-btn" data-decades="3" onclick="selectOption(this,'decades')">
        Three Decades <small>Opening + 3 decades</small>
      </button>
      <button class="option-btn" data-decades="4" onclick="selectOption(this,'decades')">
        Four Decades <small>Opening + 4 decades</small>
      </button>
      <button class="option-btn selected" data-decades="5" onclick="selectOption(this,'decades')">
        Five Decades <small>Full rosary</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Prayer mode</div>
    <div class="option-grid">
      <button class="option-btn selected" data-advance="tap" onclick="selectOption(this,'advance')">
        Tap / click <small>Buttons and arrows</small>
      </button>
      <button class="option-btn" data-advance="voice" onclick="selectOption(this,'advance')">
        Voice <small>Dictation only</small>
      </button>
    </div>
  </div>
  <button class="start-btn" id="start-btn" onclick="startRosary()" disabled>Begin</button>
</div>

<!-- Prayer Screen -->
<div class="screen" id="screen-prayer">
  <div class="controls top-controls">
    <button class="ctrl-btn btn-prev" onclick="prevBead()">← prev</button>
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Toggle voice">
      <i class="ti ti-microphone"></i>
    </button>
    <button class="ctrl-btn btn-next" onclick="nextBead()">next →</button>
  </div>
  <button class="back-btn" onclick="showSetup()">← back</button>
  <div class="prayer-header">
    <span class="mystery-name" id="mystery-label"></span>
    <span class="progress-text" id="progress-label"></span>
  </div>
  <svg id="rosary-svg" viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="prayer-card">
    <div class="prayer-type" id="prayer-type"></div>
    <div class="prayer-name" id="prayer-name"></div>
    <div class="prayer-text" id="prayer-text"></div>
    <div class="mystery-text" id="mystery-text" style="display:none"></div>
  </div>
  <div class="status-bar" id="status-bar">Use next, prev, or the arrow keys to move beads</div>
</div>

<!-- Complete Screen -->
<div class="screen" id="screen-complete">
  <div class="complete-card">
    <h2>Rosary Complete</h2>
    <hr class="divider">
    <p>"The Rosary is the weapon for these times."<br><em>— Padre Pio</em></p>
    <button class="restart-btn" onclick="showSetup()">Pray again</button>
  </div>
</div>

<script>
const MYSTERIES = {
  joyful: {
    name: 'Joyful Mysteries',
    list: ['The Annunciation','The Visitation','The Nativity','The Presentation','The Finding in the Temple']
  },
  sorrowful: {
    name: 'Sorrowful Mysteries',
    list: ['The Agony in the Garden','The Scourging at the Pillar','The Crowning with Thorns','The Carrying of the Cross','The Crucifixion']
  },
  glorious: {
    name: 'Glorious Mysteries',
    list: ['The Resurrection','The Ascension','The Descent of the Holy Spirit','The Assumption of Mary','The Coronation of Mary']
  },
  luminous: {
    name: 'Luminous Mysteries',
    list: ['The Baptism of the Lord','The Wedding at Cana','The Proclamation of the Kingdom','The Transfiguration','The Institution of the Eucharist']
  }
};

const ROSARY_TYPES = {
  dominican: { name: 'Dominican Rosary' },
  scriptural: { name: 'Scriptural Rosary' },
  sevenSorrows: { name: 'Seven Sorrows Rosary' },
  franciscanCrown: { name: 'Franciscan Crown' }
};

const PRAYERS = {
  apostlesCreed: { type: 'Opening prayer', name: "Apostle's Creed", text: "I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen." },
  ourFather: { type: 'Our Father bead', name: 'Our Father', text: "Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen." },
  hailMary: { type: 'Hail Mary bead', name: 'Hail Mary', text: "Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen." },
  gloryBe: { type: 'Glory Be', name: 'Glory Be', text: "Glory be to the Father, and to the Son, and to the Holy Spirit; as it was in the beginning, is now, and ever shall be, world without end. Amen." },
  fatima: { type: 'Fatima Prayer', name: 'O My Jesus', text: "O my Jesus, forgive us our sins, save us from the fires of hell, lead all souls to Heaven, especially those most in need of Thy mercy. Amen." },
  hailHolyQueen: { type: 'Closing prayer', name: 'Hail, Holy Queen', text: "Hail, Holy Queen, Mother of Mercy! Our life, our sweetness, and our hope! To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious Advocate, thine eyes of mercy toward us; and after this our exile show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary. Pray for us, O holy Mother of God, that we may be made worthy of the promises of Christ. Amen." }
};

function buildSequence(mysteryKey, decadeCount) {
  const mysteries = MYSTERIES[mysteryKey].list;
  const decades = Math.max(1, Math.min(5, Number(decadeCount) || 5));
  let seq = [];
  seq.push({ ...PRAYERS.apostlesCreed, bead: 'cross' });
  seq.push({ ...PRAYERS.ourFather, bead: 'large' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Faith' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Hope' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Charity' });
  seq.push({ ...PRAYERS.gloryBe, bead: 'chain' });
  for (let d = 0; d < decades; d++) {
    seq.push({ ...PRAYERS.ourFather, bead: 'large', mystery: mysteries[d], decade: d + 1 });
    for (let h = 0; h < 10; h++) {
      seq.push({ ...PRAYERS.hailMary, bead: 'small', mystery: mysteries[d] });
    }
    seq.push({ ...PRAYERS.gloryBe, bead: 'chain', mystery: mysteries[d] });
    seq.push({ ...PRAYERS.fatima, bead: 'chain', mystery: mysteries[d] });
  }
  seq.push({ ...PRAYERS.hailHolyQueen, bead: 'chain' });
  return seq;
}

let state = { mysteryKey: null, rosaryKey: 'dominican', decadeCount: 5, advanceMode: 'tap', sequence: [], currentIndex: 0, listening: false };
let selections = { mystery: null, rosary: 'dominican', decades: '5', advance: 'tap' };
let recog = null;

function selectOption(btn, group) {
  document.querySelectorAll('[data-' + group + ']').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections[group] = btn.dataset[group];
  updateStartBtn();
}

function selectTheme(btn) {
  document.querySelectorAll('[data-theme-option]').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.body.dataset.theme = btn.dataset.themeOption;
}

function updateStartBtn() {
  document.getElementById('start-btn').disabled = !selections.mystery;
}

function startRosary() {
  state.mysteryKey = selections.mystery;
  state.rosaryKey = selections.rosary;
  state.decadeCount = Number(selections.decades);
  state.advanceMode = selections.advance;
  state.sequence = buildSequence(state.mysteryKey, state.decadeCount);
  state.currentIndex = 0;
  state.listening = false;
  svgBuilt = false;
  showScreen('screen-prayer');
  renderPrayer();
  if (state.advanceMode === 'voice') setTimeout(() => startListening(), 500);
}

function showSetup() {
  stopListening();
  showScreen('screen-setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderPrayer() {
  const step = state.sequence[state.currentIndex];
  const decadeLabel = state.decadeCount === 1 ? '1 Decade' : state.decadeCount + ' Decades';
  document.getElementById('mystery-label').textContent = ROSARY_TYPES[state.rosaryKey].name + ' · ' + MYSTERIES[state.mysteryKey].name + ' · ' + decadeLabel;
  document.getElementById('progress-label').textContent = (state.currentIndex + 1) + ' / ' + state.sequence.length;
  document.getElementById('prayer-type').textContent = step.type || '';
  document.getElementById('prayer-name').textContent = step.name || '';
  document.getElementById('prayer-text').textContent = step.text || '';
  const mysteryEl = document.getElementById('mystery-text');
  if (step.mystery) {
    mysteryEl.style.display = 'block';
    mysteryEl.textContent = (step.decade ? step.decade + '. ' : '') + step.mystery;
  } else if (step.sub) {
    mysteryEl.style.display = 'block';
    mysteryEl.textContent = step.sub;
  } else {
    mysteryEl.style.display = 'none';
  }
  renderBeads();
}

// ── SVG Rosary ───────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const R_CX = 170, R_CY = 148, R_RX = 125, R_RY = 102, R_JY = 250;

const PENDANT_POS = [
  { seq: 5, y: 276, r: 4.5 },
  { seq: 4, y: 298, r: 4.5 },
  { seq: 3, y: 318, r: 4.5 },
  { seq: 2, y: 338, r: 4.5 },
  { seq: 1, y: 362, r: 7   },
];
const OF_CIRCLE = new Set([0, 13, 26, 39, 52]);
let svgBuilt = false;

function mkEl(tag) { return document.createElementNS(SVG_NS, tag); }

function addBead(svg, seqIdx, x, y, r) {
  const g = mkEl('g');
  g.setAttribute('id', 'rb-' + seqIdx);
  g.setAttribute('class', 'rb-bead');
  const c = mkEl('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  g.appendChild(c);
  svg.appendChild(g);
}

function buildRosarySVG() {
  const svg = document.getElementById('rosary-svg');
  svg.innerHTML = '';

  const defs = mkEl('defs');
  defs.innerHTML = `
    <radialGradient id="grad-done" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#6e3e08"/>
    </radialGradient>
    <radialGradient id="grad-current" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ede0c8"/>
      <stop offset="100%" stop-color="#b8a070"/>
    </radialGradient>`;
  svg.appendChild(defs);

  const ell = mkEl('ellipse');
  ell.setAttribute('cx', R_CX); ell.setAttribute('cy', R_CY);
  ell.setAttribute('rx', R_RX); ell.setAttribute('ry', R_RY);
  ell.setAttribute('class', 'rb-chain');
  svg.appendChild(ell);

  const chainYs = [R_JY, ...PENDANT_POS.map(p => p.y), 383];
  for (let i = 0; i < chainYs.length - 1; i++) {
    const ln = mkEl('line');
    ln.setAttribute('x1', R_CX); ln.setAttribute('y1', chainYs[i]);
    ln.setAttribute('x2', R_CX); ln.setAttribute('y2', chainYs[i + 1]);
    ln.setAttribute('class', 'rb-chain');
    svg.appendChild(ln);
  }

  const crossG = mkEl('g');
  crossG.setAttribute('id', 'rb-0');
  crossG.setAttribute('class', 'rb-cross');
  const vBar = mkEl('line');
  vBar.setAttribute('x1', R_CX); vBar.setAttribute('y1', 383);
  vBar.setAttribute('x2', R_CX); vBar.setAttribute('y2', 414);
  const hBar = mkEl('line');
  hBar.setAttribute('x1', R_CX - 12); hBar.setAttribute('y1', 390);
  hBar.setAttribute('x2', R_CX + 12); hBar.setAttribute('y2', 390);
  crossG.appendChild(vBar); crossG.appendChild(hBar);
  svg.appendChild(crossG);

  addBead(svg, 71, R_CX, R_JY, 9);
  for (const p of PENDANT_POS) addBead(svg, p.seq, R_CX, p.y, p.r);

  const step = (2 * Math.PI) / 66;
  for (let i = 0; i < 65; i++) {
    const angle = Math.PI / 2 - (i + 1) * step;
    addBead(svg, 6 + i,
      R_CX + R_RX * Math.cos(angle),
      R_CY + R_RY * Math.sin(angle),
      OF_CIRCLE.has(i) ? 7 : 4.5);
  }

  svgBuilt = true;
}

function renderBeads() {
  if (!svgBuilt) buildRosarySVG();
  const idx = state.currentIndex;

  const cross = document.getElementById('rb-0');
  if (cross) cross.setAttribute('class',
    'rb-cross' + (idx === 0 ? ' current' : idx > 0 ? ' done' : ''));

  for (let s = 1; s <= 71; s++) {
    const b = document.getElementById('rb-' + s);
    if (b) b.setAttribute('class',
      'rb-bead' + (s === idx ? ' current' : s < idx ? ' done' : ''));
  }
}

function nextBead() {
  if (state.currentIndex < state.sequence.length - 1) {
    state.currentIndex++;
    renderPrayer();
  } else {
    stopListening();
    showScreen('screen-complete');
  }
}

function prevBead() {
  if (state.currentIndex > 0) { state.currentIndex--; renderPrayer(); }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleMic() {
  if (state.listening) {
    stopListening();
    updateStatus('Voice paused — use next, prev, or arrow keys to move', false);
  } else {
    startListening();
  }
}

function startListening() {
  if (!SpeechRecognition) { updateStatus('Voice not supported — use Chrome or Safari', false); return; }
  if (recog) { try { recog.stop(); } catch(e){} }
  recog = new SpeechRecognition();
  recog.continuous = true;
  recog.interimResults = false;
  recog.lang = 'en-US';
  recog.onstart = () => {
    state.listening = true;
    document.getElementById('mic-btn').classList.add('listening');
    updateStatus('Listening... use buttons or arrow keys to move beads', true);
  };
  recog.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal && last[0].transcript.trim().length > 8) {
      updateStatus('Voice heard — use buttons or arrow keys to move beads', true);
    }
  };
  recog.onerror = (e) => {
    if (e.error !== 'no-speech') {
      state.listening = false;
      document.getElementById('mic-btn').classList.remove('listening');
      updateStatus('Voice error — tap mic to retry', false);
    }
  };
  recog.onend = () => {
    if (state.listening) { try { recog.start(); } catch(e){} }
    else { document.getElementById('mic-btn').classList.remove('listening'); }
  };
  try { recog.start(); } catch(e) { updateStatus('Could not start microphone', false); }
}

function stopListening() {
  state.listening = false;
  if (recog) { try { recog.stop(); } catch(e){} recog = null; }
  const btn = document.getElementById('mic-btn');
  if (btn) btn.classList.remove('listening');
}

function updateStatus(msg, active) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar' + (active ? ' active' : '');
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('screen-prayer').classList.contains('active')) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    nextBead();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevBead();
  }
});

// Pre-select today's mystery
const dayMystery = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'}[new Date().getDay()];
const todayBtn = document.querySelector('[data-mystery="' + dayMystery + '"]');
if (todayBtn) { todayBtn.classList.add('selected'); selections.mystery = dayMystery; updateStartBtn(); }
</script>
