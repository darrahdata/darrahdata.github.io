<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rosary — A Contemplative Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #171716;
    --surface: #242321;
    --surface-2: #2d2b28;
    --surface-selected: #343129;
    --border: #4a463f;
    --border-hover: #756d60;
    --text: #eee8dc;
    --text-soft: #d8d0c2;
    --muted: #aaa197;
    --muted-2: #827970;
    --accent: #c5a464;
    --accent-hover: #d2b372;
    --accent-contrast: #171716;
    --chain: #32302c;
    --bead-fill: #20201e;
    --divider: #37332d;
    --done-stroke: #94723f;
    --cross-current: #f7f1e7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-align: center;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    font-style: italic;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  .screen { display: none; width: 100%; max-width: 560px; }
  .screen.active { display: block; }

  .timer-pill {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 10;
    min-width: 72px;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(36, 35, 33, 0.92);
    color: var(--accent);
    font-size: 0.82rem;
    line-height: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    display: none;
  }
  .timer-pill.active { display: block; }

  .home-btn {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 10;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(36, 35, 33, 0.92);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.05rem;
    transition: all 0.2s;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--text); }
  body.prayer-active h1,
  body.prayer-active .subtitle,
  body.prayer-active .home-btn {
    display: none;
  }

  .setup-section { margin-bottom: 1.5rem; }
  .setup-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .decade-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .decade-grid .option-btn {
    min-height: 64px;
    padding: 0.65rem 0.35rem;
    text-align: center;
    font-size: 0.88rem;
  }
  .decade-grid .option-btn small { font-size: 0.7rem; }
  .option-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.95rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.3;
  }
  .option-btn:hover { border-color: var(--accent); color: var(--text); }
  .option-btn.selected { border-color: var(--accent); background: var(--surface-selected); color: var(--accent); }
  .option-btn small { display: block; font-size: 0.78rem; color: var(--muted-2); margin-top: 2px; font-style: italic; }
  .option-btn.selected small { color: var(--muted); }
  .mystery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

  .start-btn {
    width: 100%;
    padding: 1rem;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 1.5rem;
    transition: background 0.2s;
  }
  .start-btn:hover { background: var(--accent-hover); }
  .start-btn:disabled { background: var(--surface-selected); color: var(--muted-2); cursor: default; }

  .prayer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .mystery-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--accent);
  }
  .progress-text {
    font-size: 0.8rem;
    color: var(--muted-2);
    letter-spacing: 0.08em;
  }
  .progress-wrap {
    margin: 0.7rem 0 1rem;
    padding: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
    margin-bottom: 0.65rem;
  }
  .progress-title {
    color: var(--text);
    font-size: 0.9rem;
  }
  .progress-count {
    color: var(--accent);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .prayer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    min-height: 120px;
  }
  .prayer-type {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .prayer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.75rem;
    font-style: italic;
  }
  .prayer-text {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text-soft);
  }
  .mystery-text {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0;
    padding: 1.4rem 1rem 1rem;
    border-top: 1px solid rgba(197, 164, 100, 0.18);
    background: linear-gradient(180deg, rgba(23, 23, 22, 0), rgba(23, 23, 22, 0.9) 18%, rgba(23, 23, 22, 0.98));
    max-height: 54%;
    overflow: auto;
  }
  .mystery-kicker {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 0.35rem;
  }
  .mystery-title {
    font-family: 'Cormorant Garamond', serif;
    color: var(--accent);
    font-size: 1.35rem;
    line-height: 1.1;
    margin-bottom: 0.45rem;
  }
  .mystery-desire {
    color: var(--text-soft);
    font-style: italic;
    margin-bottom: 0.35rem;
  }
  .mystery-meditation {
    color: var(--muted);
    line-height: 1.55;
  }
  .mystery-art {
    position: relative;
    margin: 0 0 1.25rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .mystery-art img {
    display: block;
    width: 100%;
    max-height: 560px;
    object-fit: contain;
    background: var(--surface-2);
  }
  .prayer-card.image-only .mystery-art {
    margin-bottom: 0;
  }
  .prayer-card.image-only .prayer-type,
  .prayer-card.image-only .prayer-name,
  .prayer-card.image-only .prayer-text {
    display: none;
  }

  .common-prayer-section {
    margin-top: 1.5rem;
    border-top: 1px solid var(--divider);
    padding-top: 1rem;
  }
  .common-prayer-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.5rem;
  }
  .common-prayer-select {
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-soft);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.95rem;
    padding: 0 0.7rem;
  }
  .common-prayer-btn {
    min-height: 46px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: 'Lora', Georgia, serif;
    padding: 0 0.9rem;
    cursor: pointer;
  }

  .back-btn {
    position: fixed;
    top: 1rem;
    left: 3.75rem;
    z-index: 10;
    background: transparent;
    border: none;
    color: var(--muted-2);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    padding: 0;
  }
  .back-btn:hover { color: var(--text-soft); }

  .complete-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2rem;
    text-align: center;
  }
  .complete-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--accent);
    font-weight: 300;
    margin-bottom: 0.75rem;
  }
  .complete-card p { color: var(--muted); font-style: italic; line-height: 1.6; }
  .restart-btn {
    margin-top: 1.5rem;
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent); color: var(--accent-contrast); }

  hr.divider { border: none; border-top: 1px solid var(--divider); margin: 1rem 0; }

  @media (max-width: 520px) {
    .common-prayer-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="timer-pill" id="timer-pill">00:00</div>
<a class="home-btn" href="/" aria-label="Home" title="Home">
  <i class="ti ti-home"></i>
</a>

<h1>✦ The Rosary</h1>
<p class="subtitle">A contemplative companion for prayer</p>

<!-- Setup Screen -->
<div class="screen active" id="screen-setup">
  <div class="setup-section">
    <div class="setup-label">Choose mysteries</div>
    <div class="mystery-grid">
      <button class="option-btn" data-mystery="joyful" onclick="selectOption(this,'mystery')">
        Joyful <small>Monday &amp; Saturday</small>
      </button>
      <button class="option-btn" data-mystery="sorrowful" onclick="selectOption(this,'mystery')">
        Sorrowful <small>Tuesday &amp; Friday</small>
      </button>
      <button class="option-btn" data-mystery="glorious" onclick="selectOption(this,'mystery')">
        Glorious <small>Wednesday &amp; Sunday</small>
      </button>
      <button class="option-btn" data-mystery="luminous" onclick="selectOption(this,'mystery')">
        Luminous <small>Thursday</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Choose rosary</div>
    <div class="option-grid">
      <button class="option-btn selected" data-rosary="dominican" onclick="selectOption(this,'rosary')">
        Dominican <small>Traditional form</small>
      </button>
      <button class="option-btn" data-rosary="scriptural" onclick="selectOption(this,'rosary')">
        Scriptural <small>With meditations</small>
      </button>
      <button class="option-btn" data-rosary="sevenSorrows" onclick="selectOption(this,'rosary')">
        Seven Sorrows <small>Seven dolors</small>
      </button>
      <button class="option-btn" data-rosary="franciscanCrown" onclick="selectOption(this,'rosary')">
        Franciscan Crown <small>Seven joys</small>
      </button>
    </div>
  </div>
  <div class="setup-section">
    <div class="setup-label">Choose decades</div>
    <div class="option-grid decade-grid">
      <button class="option-btn" data-decades="1" onclick="selectOption(this,'decades')">
        One Decade <small>3 beads + 1 decade</small>
      </button>
      <button class="option-btn" data-decades="2" onclick="selectOption(this,'decades')">
        Two Decades <small>Opening + 2 decades</small>
      </button>
      <button class="option-btn" data-decades="3" onclick="selectOption(this,'decades')">
        Three Decades <small>Opening + 3 decades</small>
      </button>
      <button class="option-btn" data-decades="4" onclick="selectOption(this,'decades')">
        Four Decades <small>Opening + 4 decades</small>
      </button>
      <button class="option-btn selected" data-decades="5" onclick="selectOption(this,'decades')">
        Five Decades <small>Full rosary</small>
      </button>
    </div>
  </div>
  <button class="start-btn" id="start-btn" onclick="startRosary()" disabled>Begin</button>
  <div class="common-prayer-section">
    <div class="setup-label">Common prayers</div>
    <div class="common-prayer-row">
      <select class="common-prayer-select" id="common-prayer-select" aria-label="Choose a common prayer">
        <option value="comeHolySpirit">Come, Holy Spirit</option>
        <option value="divineMercy">Divine Mercy Chaplet</option>
        <option value="jesusITrust">Jesus, I Trust in You</option>
        <option value="actOfContrition">Act of Contrition</option>
        <option value="graceBeforeMeals">Grace Before Meals</option>
        <option value="guardianAngel">Guardian Angel Prayer</option>
        <option value="stMichael">Prayer to St. Michael</option>
        <option value="memorare">Memorare</option>
        <option value="angelus">The Angelus</option>
        <option value="prayerForTheSick">Prayer for the Sick</option>
        <option value="stPeregrine">Prayer to St. Peregrine</option>
      </select>
      <button class="common-prayer-btn" onclick="startCommonPrayer()">Open</button>
    </div>
  </div>
</div>

<!-- Prayer Screen -->
<div class="screen" id="screen-prayer">
  <button class="back-btn" onclick="showSetup()">← back</button>
  <div class="prayer-header">
    <span class="mystery-name" id="mystery-label"></span>
  </div>
  <div class="progress-wrap" aria-live="polite">
    <div class="progress-row">
      <div class="progress-title" id="progress-title">Prayer progress</div>
      <div class="progress-count" id="progress-label"></div>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
  <div class="prayer-card">
    <div class="mystery-art" id="mystery-art" style="display:none">
      <img id="mystery-image" loading="lazy" decoding="async" alt="">
      <div class="mystery-text" id="mystery-text" style="display:none"></div>
    </div>
    <div class="prayer-type" id="prayer-type"></div>
    <div class="prayer-name" id="prayer-name"></div>
    <div class="prayer-text" id="prayer-text"></div>
  </div>
</div>

<!-- Complete Screen -->
<div class="screen" id="screen-complete">
  <div class="complete-card">
    <h2 id="complete-title">Prayer Complete</h2>
    <hr class="divider">
    <p>"The Rosary is the weapon for these times."<br><em>— Padre Pio</em></p>
    <button class="restart-btn" onclick="showSetup()">Pray again</button>
  </div>
</div>

<script>
const MYSTERIES = {
  joyful: {
    name: 'Joyful Mysteries',
    singular: 'Joyful',
    list: [
      {
        title: 'The Annunciation',
        desire: 'I desire the love of humility.',
        meditation: 'Think of Mary’s humility when the Angel Gabriel greeted her and announced that she would become the Mother of God.',
        image: 'images/annunciation.jpg',
        alt: 'Sacred art of the Annunciation, with the Angel Gabriel greeting Mary.'
      },
      {
        title: 'The Visitation',
        desire: 'I desire charity toward my neighbor.',
        meditation: 'Think of Mary’s loving haste in visiting Elizabeth and remaining with her in service before the birth of John the Baptist.',
        image: 'images/visitation.jpg',
        alt: 'Sacred art of Mary visiting Elizabeth.'
      },
      {
        title: 'The Nativity',
        desire: 'I desire the love of God.',
        meditation: 'Think of the poverty and tenderness of Bethlehem, where Mary placed the Infant Jesus in a manger.',
        image: 'images/nativity.jpg',
        alt: 'Sacred art of the Nativity of Jesus in Bethlehem.'
      },
      {
        title: 'The Presentation',
        desire: 'I desire a spirit of sacrifice.',
        meditation: 'Think of Mary and Joseph presenting Jesus in the Temple in obedience to the law of God.',
        image: 'images/presentation.jpg',
        alt: 'Sacred art of Mary and Joseph presenting Jesus in the Temple.'
      },
      {
        title: 'The Finding in the Temple',
        desire: 'I desire zeal for the glory of God.',
        meditation: 'Think of Mary and Joseph seeking Jesus for three days, and the joy of finding Him in His Father’s house.',
        image: 'images/finding-in-the-temple.jpg',
        alt: 'Sacred art of Mary and Joseph finding the child Jesus in the Temple.'
      }
    ]
  },
  sorrowful: {
    name: 'Sorrowful Mysteries',
    singular: 'Sorrowful',
    list: [
      {
        title: 'The Agony in the Garden',
        desire: 'I desire true repentance for my sins.',
        meditation: 'Think of Jesus praying in sorrow in the Garden of Gethsemane, accepting the Father’s will for our salvation.',
        image: 'images/agony-in-the-garden.jpg',
        alt: 'Sacred art of Jesus praying in the Garden of Gethsemane.'
      },
      {
        title: 'The Scourging at the Pillar',
        desire: 'I desire a spirit of mortification.',
        meditation: 'Think of Jesus bound and scourged, offering His suffering for the sins of the world.',
        image: 'images/scourging-at-the-pillar.jpg',
        alt: 'Sacred art of Jesus at the scourging pillar.'
      },
      {
        title: 'The Crowning with Thorns',
        desire: 'I desire moral courage.',
        meditation: 'Think of Jesus mocked, crowned with thorns, and clothed in contempt, yet remaining meek and kingly.',
        image: 'images/crowning-with-thorns.jpg',
        alt: 'Sacred art of Jesus crowned with thorns.'
      },
      {
        title: 'The Carrying of the Cross',
        desire: 'I desire the virtue of patience.',
        meditation: 'Think of Jesus carrying the Cross to Calvary, bearing its weight with love and perseverance.',
        image: 'images/carrying-of-the-cross.jpg',
        alt: 'Sacred art of Jesus carrying the Cross to Calvary.'
      },
      {
        title: 'The Crucifixion',
        desire: 'I desire the grace of final perseverance.',
        meditation: 'Think of Jesus dying on the Cross, forgiving sinners and giving Himself completely to the Father.',
        image: 'images/crucifixion.jpg',
        alt: 'Sacred art of the Crucifixion of Jesus.'
      }
    ]
  },
  glorious: {
    name: 'Glorious Mysteries',
    singular: 'Glorious',
    list: [
      {
        title: 'The Resurrection',
        desire: 'I desire a strong faith.',
        meditation: 'Think of Jesus rising from the dead in triumph, conquering sin and death.',
        image: 'images/resurrection.jpg',
        alt: 'Sacred art of the Resurrection of Jesus.'
      },
      {
        title: 'The Ascension',
        desire: 'I desire the virtue of hope.',
        meditation: 'Think of Jesus ascending into Heaven, where He prepares a place for those who follow Him.',
        image: 'images/ascension.jpg',
        alt: 'Sacred art of the Ascension of Jesus into Heaven.'
      },
      {
        title: 'The Descent of the Holy Ghost',
        desire: 'I desire zeal for the glory of God.',
        meditation: 'Think of the Holy Spirit descending upon Mary and the Apostles, filling them with courage to proclaim Christ.',
        image: 'images/descent-of-the-holy-ghost.jpg',
        alt: 'Sacred art of the Holy Spirit descending upon Mary and the Apostles.'
      },
      {
        title: 'The Assumption of Mary',
        desire: 'I desire the grace of a holy death.',
        meditation: 'Think of Mary being taken body and soul into Heaven, the first and most perfect disciple of her Son.',
        image: 'images/assumption-of-mary.jpg',
        alt: 'Sacred art of the Assumption of Mary into Heaven.'
      },
      {
        title: 'The Coronation of Mary',
        desire: 'I desire a greater love for the Blessed Virgin Mary.',
        meditation: 'Think of Mary crowned Queen of Heaven and Earth, interceding for her children with a mother’s love.',
        image: 'images/coronation-of-mary.jpg',
        alt: 'Sacred art of the Coronation of Mary as Queen of Heaven and Earth.'
      }
    ]
  },
  luminous: {
    name: 'Luminous Mysteries',
    singular: 'Luminous',
    list: [
      {
        title: 'The Baptism of the Lord',
        desire: 'I desire openness to the Holy Spirit.',
        meditation: 'Think of Jesus baptized in the Jordan, as the Father reveals Him as His beloved Son and the Spirit descends upon Him.',
        image: 'images/baptism-of-the-lord.jpg',
        alt: 'Sacred art of the Baptism of Jesus in the Jordan River.'
      },
      {
        title: 'The Wedding at Cana',
        desire: 'I desire trust in Mary’s intercession.',
        meditation: 'Think of Mary saying, “Do whatever He tells you,” and Jesus performing His first miracle at her request.',
        image: 'images/wedding-at-cana.jpg',
        alt: 'Sacred art of the Wedding at Cana.'
      },
      {
        title: 'The Proclamation of the Kingdom',
        desire: 'I desire repentance and conversion.',
        meditation: 'Think of Jesus calling all people to turn from sin, believe the Gospel, and enter the Kingdom of God.',
        image: 'images/proclamation-of-the-kingdom.jpg',
        alt: 'Sacred art of Jesus proclaiming the Kingdom of God.'
      },
      {
        title: 'The Transfiguration',
        desire: 'I desire a desire for holiness.',
        meditation: 'Think of Jesus shining in glory before Peter, James, and John, revealing the splendor of His divine life.',
        image: 'images/transfiguration.jpg',
        alt: 'Sacred art of the Transfiguration of Jesus.'
      },
      {

function buildSequence(mysteryKey, decadeCount) {
  const mysteries = MYSTERIES[mysteryKey].list;
  const decades = Math.max(1, Math.min(5, Number(decadeCount) || 5));
  let seq = [];
  seq.push({ ...PRAYERS.apostlesCreed, bead: 'cross' });
  seq.push({ ...PRAYERS.ourFather, bead: 'large' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Faith' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Hope' });
  seq.push({ ...PRAYERS.hailMary, bead: 'small', sub: 'For an increase in Charity' });
  seq.push({ ...PRAYERS.gloryBe, bead: 'chain' });
  for (let d = 0; d < decades; d++) {
    seq.push({ ...PRAYERS.ourFather, bead: 'large', mystery: mysteries[d], decade: d + 1 });
    for (let h = 0; h < 10; h++) {
      seq.push({ ...PRAYERS.hailMary, bead: 'small', mystery: mysteries[d] });
    }
    seq.push({ ...PRAYERS.gloryBe, bead: 'chain', mystery: mysteries[d] });
    seq.push({ ...PRAYERS.fatima, bead: 'chain', mystery: mysteries[d] });
  }
  seq.push({ ...PRAYERS.hailHolyQueen, bead: 'chain' });
  return seq;
}

let state = {
  mysteryKey: null,
  rosaryKey: 'dominican',
  commonPrayerKey: null,
  decadeCount: 5,
  sequence: [],
  currentIndex: 0,
  startedAt: null
};
let selections = { mystery: null, rosary: 'dominican', decades: '5' };
let timerInterval = null;

function selectOption(btn, group) {
  document.querySelectorAll('[data-' + group + ']').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selections[group] = btn.dataset[group];
  updateStartBtn();
}

function updateStartBtn() {
  document.getElementById('start-btn').disabled = !selections.mystery;
}

function startRosary() {
  state.mysteryKey = selections.mystery;
  state.rosaryKey = selections.rosary;
  state.commonPrayerKey = null;
  state.decadeCount = Number(selections.decades);
  state.sequence = buildSequence(state.mysteryKey, state.decadeCount);
  state.currentIndex = 0;
  state.startedAt = Date.now();
  showScreen('screen-prayer');
  startTimer();
  renderPrayer();
}

function startCommonPrayer() {
  const key = document.getElementById('common-prayer-select').value;
  const prayer = COMMON_PRAYERS[key];
  if (!prayer) return;
  state.mysteryKey = null;
  state.rosaryKey = null;
  state.commonPrayerKey = key;
  state.sequence = [{ ...prayer, bead: 'chain' }];
  state.currentIndex = 0;
  state.startedAt = Date.now();
  showScreen('screen-prayer');
  startTimer();
  renderPrayer();
}

function showSetup() {
  stopTimer();
  showScreen('screen-setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('prayer-active', id === 'screen-prayer');
}

function renderPrayer() {
  const step = state.sequence[state.currentIndex];
  const total = state.sequence.length || 1;
  const progress = Math.round(((state.currentIndex + 1) / total) * 100);
  if (state.commonPrayerKey) {
    document.getElementById('mystery-label').textContent = step.name;
  } else {
    const decadeLabel = state.decadeCount === 1 ? '1 Decade' : state.decadeCount + ' Decades';
    document.getElementById('mystery-label').textContent = ROSARY_TYPES[state.rosaryKey].name + ' · ' + MYSTERIES[state.mysteryKey].name + ' · ' + decadeLabel;
  }
  document.getElementById('progress-title').textContent = step.name || 'Prayer progress';
  document.getElementById('progress-label').textContent = 'Prayer ' + (state.currentIndex + 1) + ' of ' + total + ' · ' + progress + '%';
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('prayer-type').textContent = step.type || '';
  document.getElementById('prayer-name').textContent = step.name || '';
  renderPrayerText(step.text || '');
  document.querySelector('.prayer-card').classList.toggle('image-only', Boolean(state.commonPrayerKey && step.image));
  const mysteryEl = document.getElementById('mystery-text');
  if (step.mystery) {
    const details = getMysteryMeditation(step.mystery);
    renderMysteryImage(details);
    renderMysteryMeditation(mysteryEl, step, details);
  } else if (step.image) {
    renderMysteryImage(step);
    mysteryEl.style.display = 'none';
    mysteryEl.innerHTML = '';
  } else if (step.sub) {
    hideMysteryImage();
    mysteryEl.style.display = 'none';
    mysteryEl.innerHTML = '';
  } else {
    hideMysteryImage();
    mysteryEl.style.display = 'none';
  }
}

function getMysteryMeditation(mystery) {
  const meditations = MYSTERIES[state.mysteryKey]?.list || [];
  const title = typeof mystery === 'string' ? mystery : mystery?.title;
  const index = meditations.findIndex(item => item.title === title);
  if (index === -1) return null;
  return { ...meditations[index], index };
}

function appendMysteryLine(container, className, text) {
  const el = document.createElement('div');
  el.className = className;
  el.textContent = text;
  container.appendChild(el);
}

function hideMysteryImage() {
  const wrap = document.getElementById('mystery-art');
  const image = document.getElementById('mystery-image');
  const text = document.getElementById('mystery-text');
  wrap.style.display = 'none';
  image.removeAttribute('src');
  image.alt = '';
  text.style.display = 'none';
  text.innerHTML = '';
}

function renderMysteryImage(details) {
  const wrap = document.getElementById('mystery-art');
  const image = document.getElementById('mystery-image');
  if (!details?.image) {
    hideMysteryImage();
    return;
  }
  image.onerror = () => {
    wrap.style.display = 'none';
  };
  image.onload = () => {
    wrap.style.display = 'block';
  };
  image.alt = details.alt || details.title || '';
  image.src = details.image;
  wrap.style.display = 'block';
}

function renderMysteryMeditation(container, step, details) {
  container.style.display = 'block';
  container.innerHTML = '';

  if (!details) {
    const mysteryTitle = typeof step.mystery === 'string' ? step.mystery : step.mystery?.title;
    container.textContent = (step.decade ? step.decade + '. ' : '') + mysteryTitle;
    return;
  }

  const setName = MYSTERIES[state.mysteryKey].singular;
  const ordinal = ORDINALS[details.index] || String(details.index + 1);
  appendMysteryLine(container, 'mystery-kicker', 'The ' + ordinal + ' ' + setName + ' Mystery');
  appendMysteryLine(container, 'mystery-title', details.title);
  appendMysteryLine(container, 'mystery-desire', details.desire);
  appendMysteryLine(container, 'mystery-meditation', details.meditation);
}

function renderPrayerText(text) {
  const prayerText = document.getElementById('prayer-text');
  prayerText.textContent = text;
}

function startTimer() {
  stopTimer(false);
  updateTimer();
  document.getElementById('timer-pill').classList.add('active');
  timerInterval = setInterval(updateTimer, 1000);
}

function stopTimer(hide = true) {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  if (hide) document.getElementById('timer-pill').classList.remove('active');
}

function updateTimer() {
  if (!state.startedAt) return;
  const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
  const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const seconds = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timer-pill').textContent = minutes + ':' + seconds;
}

function nextBead() {
  if (state.currentIndex < state.sequence.length - 1) {
    state.currentIndex++;
    renderPrayer();
  } else {
    stopTimer(false);
    document.getElementById('complete-title').textContent = state.commonPrayerKey ? 'Prayer Complete' : 'Rosary Complete';
    showScreen('screen-complete');
  }
}

function prevBead() {
  if (state.currentIndex > 0) { state.currentIndex--; renderPrayer(); }
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('screen-prayer').classList.contains('active')) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    nextBead();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevBead();
  }
});

document.addEventListener('pointerup', (e) => {
  if (!document.getElementById('screen-prayer').classList.contains('active')) return;
  if (e.target.closest('button, a, select, input, textarea, label')) return;
  if (e.clientX < window.innerWidth / 2) prevBead();
  else nextBead();
});

// Pre-select today's mystery
const dayMystery = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'}[new Date().getDay()];
const todayBtn = document.querySelector('[data-mystery="' + dayMystery + '"]');
if (todayBtn) { todayBtn.classList.add('selected'); selections.mystery = dayMystery; updateStartBtn(); }
